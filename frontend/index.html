<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070A12" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AR Samba — Samba share, user and ACL management for Ubuntu Server." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AR Samba</title>
    <style>
      /* Paint the shell colour before the bundle lands so there's no white flash */
      html { background: #070A12; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #070A12; z-index: 9999;
      }
      #boot .ring {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2.5px solid rgba(56,189,248,.18);
        border-top-color: #38BDF8;
        animation: bootspin .7s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
    </style>
  </head>
  <body class="bg-abyss text-ink antialiased">
    <div id="boot"><div class="ring"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
