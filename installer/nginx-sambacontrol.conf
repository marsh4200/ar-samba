# /etc/nginx/sites-available/sambacontrol
# Installed by SambaControl. Generated on first install.

upstream sambacontrol_backend {
    server 127.0.0.1:9913;
    keepalive 16;
}

server {
    listen 9912 default_server;
    listen [::]:9912 default_server;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 16M;

    root /opt/sambacontrol/frontend/dist;
    index index.html;

    location ~ ^/(api|api/docs|api/redoc|api/openapi.json) {
        proxy_pass http://sambacontrol_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
}
